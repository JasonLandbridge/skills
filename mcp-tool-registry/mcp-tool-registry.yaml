    args: { owner: "<owner>", repo: "<repo>", branch: "<branch>", path: "<repo-path>", content: "<file-content>", message: "<commit-message>", sha: "<existing-file-sha-if-updating>" }
    guard: "Remote GitHub write and commit. SHA is required when updating an existing file."

  "github:push_files":
    call: read
    risk: remote-write
    args: { owner: "<owner>", repo: "<repo>", branch: "<branch>", files: [{ path: "<repo-path>", content: "<file-content>" }], message: "<commit-message>" }
