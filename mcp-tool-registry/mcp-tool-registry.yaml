    verified: { source: "retrieve_tools", notes: "Required: projectPath. Optional: workingDirectory, includeStackTrace." }

  "dotnet-test-mcp:run_all_tests":
    call: read
    risk: executes-code
    args: { workingDirectory: "<project-root>", includeStackTrace: false }
    guard: "Executes all tests in the solution or working directory."
    verified: { source: "retrieve_tools", notes: "Optional: workingDirectory, includeStackTrace." }

  # .NET SDK MCP tools
  "dotnet-mcp:dotnet_project":
    call: destructive
    risk: mixed-dotnet-project-action
    args: { action: "Build", project: "<project-root>/<project.csproj>", workingDirectory: "<project-root>" }
    guard: "Actions include create, run, clean, stop, format, and project mutation. Choose action deliberately."

  "dotnet-mcp:dotnet_ef":
    call: destructive
    risk: database-or-migration-write
    args: { action: "MigrationsList", project: "<project-root>/<project.csproj>", workingDirectory: "<project-root>" }
    guard: "DatabaseUpdate/DatabaseDrop and migration writes require explicit confirmation."

