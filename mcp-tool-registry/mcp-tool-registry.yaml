  "git-mcp-server:git_commit":
    call: write
    risk: vcs-write
    args: { path: "<project-root>", message: "<commit-message>" }
    guard: "Creates a git commit; require explicit current user request."

  # GitHub MCP tools
  "github:get_file_contents":
    call: read
    args: { owner: "<owner>", repo: "<repo>", path: "<repo-path>" }

  "github:pull_request_read":
    call: read
    args: { method: "get", owner: "<owner>", repo: "<repo>", pullNumber: 1 }

  "github:issue_read":
    call: read
    args: { method: "get", owner: "<owner>", repo: "<repo>", issue_number: 1 }

  "github:search_code":
    call: read
    args: { query: "<github-code-search-query>" }

  "github:search_issues":
