    args: { owner: "<owner>", repo: "<repo>", sha: "<sha-or-ref>", include_diff: true }

  "github:get_release_by_tag":
    call: read
    args: { owner: "<owner>", repo: "<repo>", tag: "<tag>" }

  "github:actions_list":
    call: read
    args: { method: "list_workflows", owner: "<owner>", repo: "<repo>" }

  "github:actions_get":
    call: read
    args: { method: "get_workflow_run", owner: "<owner>", repo: "<repo>", resource_id: "<workflow-run-or-job-id>" }

  "github:get_job_logs":
    call: read
    args: { owner: "<owner>", repo: "<repo>", job_id: 1, tail_lines: 500 }

  "github:create_or_update_file":
