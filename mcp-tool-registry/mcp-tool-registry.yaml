  # Purpose-built .NET test tools
  "dotnet-test-mcp:list_test_projects":
    call: read
    args: { workingDirectory: "<project-root>" }
    verified: { source: "retrieve_tools", notes: "Optional: workingDirectory." }

  "dotnet-test-mcp:list_tests_summary":
    call: read
    args: { workingDirectory: "<project-root>", includeTests: false, requireTests: false }
    verified: { source: "retrieve_tools", notes: "Supports prefix, projectPath, requireTests, includeTests, workingDirectory." }

  "dotnet-test-mcp:run_single_test":
    call: read
    risk: executes-code
    args: { testName: "<fully-qualified-test-name>", projectPath: "<project-root>/<test-project.csproj>", workingDirectory: "<project-root>", includeStackTrace: false }
    guard: "Executes a test process. Current schema uses testName; projectPath is an alias for project."
    verified: { source: "retrieve_tools", notes: "Required: testName. Optional: project/projectPath, workingDirectory, includeStackTrace." }

  "dotnet-test-mcp:run_all_tests_in_class":
    call: read
    risk: executes-code
    args: { className: "<fully-qualified-test-class-name>", projectPath: "<project-root>/<test-project.csproj>", workingDirectory: "<project-root>", includeStackTrace: false }
    guard: "Executes a test process. projectPath is an alias for project."
    verified: { source: "retrieve_tools", notes: "Required: className. Optional: project/projectPath, workingDirectory, includeStackTrace." }

  "dotnet-test-mcp:run_all_tests_for_project":
