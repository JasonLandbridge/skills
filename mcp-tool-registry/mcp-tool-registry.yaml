# Minimal MCP tool registry
# Exact MCP server:tool names and first-call argument templates verified against mcpproxy schemas.
# This file is a cache for /only-use-mcp-tools, not a replacement for discovery or safety rules.

version: 1
kind: mcp-tool-registry

contract:
  companionSkill: "only-use-mcp-tools"
  callMeaning: "Cached mcpproxy wrapper suffix from verified retrieve_tools call_with; not a semantic safety label."
  wrapperMap:
    read: "mcpproxy_call_tool_read"
    write: "mcpproxy_call_tool_write"
    destructive: "mcpproxy_call_tool_destructive"
  rules:
    - "Fresh mcpproxy_retrieve_tools output wins over this registry."
    - "Always include intent_reason and intent_data_sensitivity on proxied calls."
    - "Always obey guard notes and explicit user-request requirements, even when call is read."
    - "Registry args are minimum viable first-call templates, not exhaustive schemas."
    - "Direct registry retries for risky actions require explicit current user intent."
    - "When a registry entry appears stale, stop retrying it and refresh from discovery/schema."
    - "Do not run skillshare commands during normal registry lookup, validation, or maintenance."
    - "Validate this skill through MCP schema freshness and file diagnostics for this folder, not target sync."
    - "Never guess a server:tool name that is not listed here or returned by discovery."

placeholders:
  projectRoot: "<project-root>"
  relativePath: "<relative-path>"
  relativeDirectory: "<relative-directory>"
  repoPath: "<repo-path>"
  owner: "<owner>"
  repo: "<repo>"
  branch: "<branch>"
  tag: "<tag>"
  url: "<url>"
  sha: "<sha-or-ref>"
  workflowId: "<workflow-id-or-file>"
  runId: "<workflow-run-id>"
  jobId: "<job-id>"

# risk values are advisory only. The mcpproxy wrapper is still selected by `call`.
tools:
  # JetBrains Rider / backend-oriented project tools
  "rider-official:get_file_text_by_path":
    call: read
    args: { projectPath: "<project-root>", pathInProject: "<relative-path>", truncateMode: "NONE" }

  "rider-official:read_file":
    call: read
    args: { projectPath: "<project-root>", file_path: "<relative-path>", mode: "slice", start_line: 1, max_lines: 200 }

  "rider-official:replace_text_in_file":
    call: read
    risk: file-write
    args: { projectPath: "<project-root>", pathInProject: "<relative-path>", oldText: "<exact-existing-text>", newText: "<replacement-text>", replaceAll: false }
    guard: "Edits and saves a file. Read wrapper mirrors current call_with; use only for user-requested edits."

  "rider-official:replace_text_undoable":
    call: read
    risk: file-write
    args: { projectPath: "<project-root>", pathInProject: "<relative-path>", oldText: "<exact-existing-text>", newText: "<replacement-text>" }
    guard: "Edits a file while preserving IDE undo. Prefer for targeted manual-reviewable edits."

  "rider-official:create_new_file":
    call: read
    risk: file-write
    args: { projectPath: "<project-root>", pathInProject: "<relative-path>", text: "<full-file-content>", overwrite: false }
    guard: "Creates a file; set overwrite=true only when replacing a file is intentional."

  "rider-official:delete_file":
    call: read
    risk: destructive
    args: { projectPath: "<project-root>", filePath: "<relative-path>" }
    guard: "Deletes a file or empty directory; require explicit user confirmation."

  "rider-official:list_directory_tree":
    call: read
    args: { projectPath: "<project-root>", directoryPath: "<relative-directory>", maxDepth: 3 }

  "rider-official:find_files_by_glob":
    call: read
    args: { projectPath: "<project-root>", globPattern: "<glob>", fileCountLimit: 100 }

  "rider-official:find_files_by_name_keyword":
    call: read
    args: { projectPath: "<project-root>", nameKeyword: "<filename-keyword>", fileCountLimit: 50 }

  "rider-official:search_text":
    call: read
    args: { projectPath: "<project-root>", q: "<literal-text>", paths: ["<relative-directory>/**"], limit: 50 }

  "rider-official:search_regex":
    call: read
    args: { projectPath: "<project-root>", q: "<regex>", paths: ["<relative-directory>/**"], limit: 50 }

  "rider-official:search_symbol":
    call: read
    args: { projectPath: "<project-root>", q: "<symbol-query>", limit: 50 }

  "rider-official:search_in_files_by_text":
    call: read
    args: { projectPath: "<project-root>", searchText: "<literal-text>", maxUsageCount: 50 }

  "rider-official:search_in_files_by_regex":
    call: read
    args: { projectPath: "<project-root>", regexPattern: "<regex>", maxUsageCount: 50 }

  "rider-official:get_file_problems":
    call: read
    args: { projectPath: "<project-root>", filePath: "<relative-path>", severity: "error" }

  "rider-official:run_inspections":
    call: read
    args: { projectPath: "<project-root>", path: "<relative-path>", severity: "warning" }

  "rider-official:get_symbol_info":
    call: read
    args: { projectPath: "<project-root>", filePath: "<relative-path>", line: 1, column: 1 }

  "rider-official:reformat_file":
    call: read
    risk: file-write
    args: { projectPath: "<project-root>", path: "<relative-path>" }
    guard: "Can rewrite formatting; use only after user-requested edits or explicit formatting request."

  "rider-official:build_solution":
    call: read
    risk: executes-code
    args: { projectPath: "<project-root>", rebuild: false }
    guard: "Builds the solution and may create build artifacts."

  "rider-official:get_build_output":
    call: read
    args: { projectPath: "<project-root>" }

  "rider-official:list_run_configurations":
    call: read
    args: { projectPath: "<project-root>" }

  "rider-official:get_run_configurations":
    call: read
    args: { projectPath: "<project-root>" }

  "rider-official:get_run_configuration_xml":
    call: read
    args: { projectPath: "<project-root>", configurationName: "<configuration-name>" }

  "rider-official:create_run_configuration_from_xml":
    call: read
    risk: ide-write
    args: { projectPath: "<project-root>", name: "<configuration-name>", xml: "<run-configuration-xml>" }
    guard: "Creates an IDE run configuration; require explicit user request."

  "rider-official:execute_run_configuration":
    call: read
    risk: executes-code
    args: { projectPath: "<project-root>", configurationName: "<configuration-name>", waitForExit: true, timeout: 600000 }
    guard: "Executes code from an IDE run configuration."

  "rider-official:start_run_configuration":
    call: read
    risk: executes-code
    args: { projectPath: "<project-root>", configurationName: "<configuration-name>", waitForExit: false }
    guard: "Starts a process; stop it separately if needed."

  "rider-official:debug_run_configuration":
    call: read
    risk: executes-code-debug
    args: { projectPath: "<project-root>", configurationName: "<configuration-name>", waitForExit: false, timeoutMs: 600000 }
    guard: "Starts a debug session; use only when debugging is requested and inspect/stop it deliberately."

  "rider-official:modify_run_configuration":
    call: read
    risk: ide-write
    args: { projectPath: "<project-root>", configurationName: "<configuration-name>", programArguments: "<program-arguments>" }
    guard: "Persists run configuration changes; provide only fields intentionally changed."

  "rider-official:get_console_output":
    call: read
    args: { projectPath: "<project-root>" }

  "rider-official:get_terminal_output":
    call: read
    args: { projectPath: "<project-root>" }

  "rider-official:get_test_results":
    call: read
    args: { projectPath: "<project-root>" }

  "rider-official:execute_ide_action":
    call: read
    risk: ide-write
    args: { projectPath: "<project-root>", search: "<action-search>" }
    guard: "Use search first. Supplying actionId/configurable can change IDE state."

  "rider-official:get_vcs_changes":
    call: read
    args: { projectPath: "<project-root>", includeDiff: false }

  "rider-official:get_vcs_branch":
    call: read
    args: { projectPath: "<project-root>" }

  "rider-official:get_vcs_log":
    call: read
    args: { projectPath: "<project-root>", maxCount: 20 }

  "rider-official:get_vcs_blame":
    call: read
    args: { projectPath: "<project-root>", filePath: "<relative-path>", startLine: 1, endLine: 200 }

  "rider-official:vcs_show_commit":
    call: read
    args: { projectPath: "<project-root>", hash: "<commit-or-ref>", statOnly: false }

  "rider-official:get_vcs_diff_between_branches":
    call: read
    args: { projectPath: "<project-root>", ref1: "<base-ref>", ref2: "<target-ref>", statOnly: false }

  "rider-official:vcs_stage_files":
    call: read
    risk: vcs-write
    args: { projectPath: "<project-root>", action: "stage", files: ["<relative-path>"] }
    guard: "Stages or unstages git files; require explicit current user request."

  "rider-official:vcs_commit":
    call: read
    risk: vcs-write
    args: { projectPath: "<project-root>", message: "<commit-message>" }
    guard: "Creates a git commit; require explicit current user request."

  "rider-official:vcs_push":
    call: read
    risk: remote-write
    args: { projectPath: "<project-root>" }
    guard: "Pushes commits to remote; require explicit current user request."

  # JetBrains WebStorm / frontend-oriented project tools
  "webstorm-official:get_file_text_by_path":
    call: read
    args: { projectPath: "<project-root>", pathInProject: "<relative-path>", truncateMode: "NONE" }

